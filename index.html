<!DOCTYPE html> <!--serve para indicar a programação ultilizadaultilizada-->
<html lang="en"> <!--abertura que delimita o documento, todas as tags devem ficar dentro desse espaço.ultilizada-->
<head> <!--define o cabeçalho do documento, as informações colocadas dentro desse limite, não aparecem no navegador mas contem instruções sobre esse conteúdo. Dentro dessa tag podemos colocar folhaas de estilos  scripts.-->
    <meta charset="UTF-8"> <!--Especifica qual conjunto de caracteres(caracter set ou charset) será usado para renderizar(converter o codigo em um arquivo) o texto da pagina.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Fornecem os metados sobre a sua pagina.-->
    <title>Portifolio</title> <!--É o titulo do seu documento.-->
</head> <!-- Fechamento da tag do cabeçalho.-->
<body> <!--Abertura da tag, marcando o espaço no qual deve estar contido o conteúdo visual da pagina. As demais tags que representam o texto, botoẽs, etc. Devem ser adicionadas nesse intervalo-->
    
</body> <!--Fechamento da tag do corpo do projeto-->
</html> <!--Fechamento do documento.-->
